[workspace]
resolver = "3"
members = [
    "nonsecure-app",
    "nucleo-u5a5zj-bsp",
    "step1-option-bytes",
    "step2-secure-watermark",
    "secure-loader",
    "stm32u5-tiny-hal",
]

[workspace.dependencies]
cortex-m = { version = "0.7.8", features = ["critical-section-single-core", "secure-mode"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
critical-section = "1"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
nucleo-u5a5zj-bsp = { path = "./nucleo-u5a5zj-bsp" }
stm32u5 = { version = "0.16.0", features = ["stm32u5a5"] }
stm32u5-tiny-hal = { path = "./stm32u5-tiny-hal" }

[profile.release]
debug = 2

[profile.dev]
opt-level = 1

